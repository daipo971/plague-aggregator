# ============================================================
# 信源配置文件
# 说明：
#   1. 增删信源只改这里，不用动代码
#   2. type 只能填以下几类：
#        official       官方机构（WHO、各国疾控等）
#        professional   专业机构（CIDRAP、学术期刊等）
#        media          正规媒体（Google 新闻关键词等）
#        unverified     未证实（社交平台等），单独栏目展示
#        controversial  争议说法 / 阴谋论，单独栏目展示，并加醒目提示
#   3. enabled: false 的源会被跳过
#   4. kind: x_search 表示 X（推特）搜索 API，需要在 GitHub Secrets 里配置 X_BEARER_TOKEN；
#      没有配置时会自动跳过，不影响其他信源
#   5. 所有信源都会按鼠疫相关关键词过滤，无关内容会被丢弃
# ============================================================


sources:
  # ---------- 官方 ----------
  - name: "WHO 新闻（英文）"
    type: official
    rss: "https://www.who.int/rss-feeds/news-english.xml"
    enabled: true

  - name: "官方网站收录 · WHO / CDC / ECDC 鼠疫相关"
    type: official
    rss: "https://news.google.com/rss/search?q=%28site%3Awho.int+OR+site%3Acdc.gov+OR+site%3Aecdc.europa.eu%29+plague&hl=en-US&gl=US&ceid=US:en"
    enabled: true


  # ---------- 专业 ----------
  - name: "CIDRAP 鼠疫专题"
    type: professional
    rss: "https://www.cidrap.umn.edu/news/88/rss"
    enabled: true

  - name: "CDC《新发传染病》期刊 EID"
    type: professional
    rss: "http://wwwnc.cdc.gov/eid/rss/ahead-of-print.xml"
    enabled: true


  # ---------- 媒体（Google 新闻关键词，多语言） ----------
  - name: "Google 新闻 · plague（英文）"
    type: media
    rss: "https://news.google.com/rss/search?q=plague&hl=en-US&gl=US&ceid=US:en"
    enabled: true

  - name: "Google 新闻 · 鼠疫（中文）"
    type: media
    rss: "https://news.google.com/rss/search?q=鼠疫&hl=zh-CN&gl=CN&ceid=CN:zh"
    enabled: true

  - name: "Google 新闻 · чума（俄文）"
    type: media
    rss: "https://news.google.com/rss/search?q=чума&hl=ru&gl=RU&ceid=RU:ru"
    enabled: true

  - name: "Google 新闻 · peste（西语）"
    type: media
    rss: "https://news.google.com/rss/search?q=peste&hl=es&gl=ES&ceid=ES:es"
    enabled: true

  - name: "Google 新闻 · peste（法语）"
    type: media
    rss: "https://news.google.com/rss/search?q=peste&hl=fr&gl=FR&ceid=FR:fr"
    enabled: true

  - name: "Bing 新闻 · plague（英文）"
    type: media
    rss: "https://www.bing.com/news/search?q=plague&format=rss"
    enabled: true

  - name: "Bing 新闻 · 鼠疫（中文）"
    type: media
    rss: "https://www.bing.com/news/search?q=%E9%BC%A0%E7%96%AB&format=rss"
    enabled: true


  # ---------- 未证实（X 推特，需要 X_BEARER_TOKEN） ----------
  - name: "X 推特 · plague（未证实）"
    type: unverified
    kind: x_search
    query: "(plague OR pneumonic plague OR 鼠疫) -is:retweet lang:en"
    enabled: true

  - name: "X 推特 · 鼠疫（未证实）"
    type: unverified
    kind: x_search
    query: "(鼠疫 OR 瘟疫) -is:retweet"
    enabled: true


  # ---------- 争议说法（X 推特，需要 X_BEARER_TOKEN） ----------
  - name: "X 推特 · plague 阴谋论（争议）"
    type: controversial
    kind: x_search
    query: "(plague OR pneumonic plague) (conspiracy OR hoax OR bioweapon OR \"lab leak\" OR cover-up) -is:retweet lang:en"
    enabled: true
